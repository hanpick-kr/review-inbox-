<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>리뷰인박스</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="리뷰인박스" />
<meta name="theme-color" content="#4c2c8f" />
<style>
  :root {
    --bg: #f5f3fb;
    --card-bg: #ffffff;
    --text: #1c1530;
    --muted: #6b6480;
    --accent: #4c2c8f;
    --border: #e6e1f5;
    --pending: #ff9f43;
    --confirmed: #2ecc71;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14101f;
      --card-bg: #1f1930;
      --text: #f1eefb;
      --muted: #a79ecb;
      --accent: #a78bfa;
      --border: #322a4a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 16px) 20px 12px;
    z-index: 10;
  }
  h1 { font-size: 20px; margin: 0; }
  main { padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
  }
  label { font-size: 12px; color: var(--muted); display: block; margin: 0 0 6px; }
  textarea {
    width: 100%;
    min-height: 100px;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 10px;
    font-size: 15px;
    background: transparent;
    color: var(--text);
    resize: vertical;
    font-family: inherit;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  button {
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: white; width: 100%; margin-top: 10px; font-weight: 600; }
  .btn-primary:disabled { opacity: 0.5; }
  .btn-copy { background: var(--border); color: var(--text); }
  #resultCard { display: none; }
  .field-label { font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .result-text {
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.5;
    background: var(--bg);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 6px;
  }
  .tabs { display: flex; gap: 8px; padding: 4px 0; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }
  .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; color: white; }
  .badge.pending { background: var(--pending); }
  .badge.confirmed { background: var(--confirmed); }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .date { font-size: 12px; color: var(--muted); }
  .raw { font-size: 13px; color: var(--muted); margin-bottom: 10px; white-space: pre-wrap; }
  .btnrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn-confirm { background: var(--accent); color: white; }
  .btn-confirm:disabled { opacity: 0.5; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
  .section-title { font-size: 15px; font-weight: 600; margin: 6px 0 0; }
</style>
</head>
<body>

<header>
  <h1>리뷰인박스</h1>
</header>

<main>
  <div class="card">
    <label for="rawInput">새 리뷰 (키보드의 마이크 버튼으로 받아쓰기 가능)</label>
    <textarea id="rawInput" placeholder="오늘 다녀온 곳 어땠는지 말씀해주세요..."></textarea>
    <button id="submitBtn" class="btn-primary">정제하기</button>
    <p id="submitStatus" class="hint"></p>
  </div>

  <div class="card" id="resultCard">
    <div class="field-label">한국어</div>
    <div class="result-text" id="resultKo"></div>
    <button class="btn-copy" data-copy="resultKo">한국어 복사</button>
    <div class="field-label">中文</div>
    <div class="result-text" id="resultZh"></div>
    <button class="btn-copy" data-copy="resultZh">中文 복사</button>
  </div>

  <p class="section-title">지난 리뷰</p>
  <div class="tabs">
    <div class="tab active" data-status="pending">대기중</div>
    <div class="tab" data-status="confirmed">확정됨</div>
  </div>
  <div id="list"></div>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://nuvwfcecaafgpksnvizd.supabase.co";
const SUPABASE_KEY = "sb_publishable_pnA8OfMO3-3mF7J-UNtbgQ_zv7SMKsE";
const INGEST_URL = "https://nuvwfcecaafgpksnvizd.supabase.co/functions/v1/ingest-review";
const INGEST_SECRET = "9c57e02bdb4d39b16ea14391e5c5873c89f50ee118e86d5460f8bd1fec8e8be5";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const rawInput = document.getElementById("rawInput");
const submitBtn = document.getElementById("submitBtn");
const submitStatus = document.getElementById("submitStatus");
const resultCard = document.getElementById("resultCard");
const resultKo = document.getElementById("resultKo");
const resultZh = document.getElementById("resultZh");
const listEl = document.getElementById("list");

let currentTab = "pending";

submitBtn.addEventListener("click", async () => {
  const text = rawInput.value.trim();
  if (!text) return;
  submitBtn.disabled = true;
  submitStatus.textContent = "정제 중...";
  resultCard.style.display = "none";
  try {
    const res = await fetch(INGEST_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + INGEST_SECRET,
      },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      submitStatus.textContent = "오류: " + (data.error || res.status);
      return;
    }
    resultKo.textContent = data.refined_ko || "(정제 실패, 원문 그대로 저장됨)";
    resultZh.textContent = data.refined_zh || "(정제 실패, 원문 그대로 저장됨)";
    resultCard.style.display = "block";
    submitStatus.textContent = "완료!";
    rawInput.value = "";
    loadReviews();
  } catch (e) {
    submitStatus.textContent = "오류: " + e.message;
  } finally {
    submitBtn.disabled = false;
  }
});

document.querySelectorAll("[data-copy]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const el = document.getElementById(btn.dataset.copy);
    navigator.clipboard.writeText(el.textContent);
  });
});

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    currentTab = tab.dataset.status;
    loadReviews();
  });
});

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString("ko-KR", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

async function loadReviews() {
  listEl.innerHTML = "";
  const { data, error } = await supabase
    .from("reviews")
    .select("*")
    .eq("status", currentTab)
    .order("created_at", { ascending: false });

  if (error) {
    listEl.innerHTML = '<div class="empty">불러오기 실패: ' + escapeHtml(error.message) + "</div>";
    return;
  }
  if (!data || data.length === 0) {
    listEl.innerHTML = '<div class="empty">항목이 없습니다</div>';
    return;
  }
  for (const review of data) {
    listEl.appendChild(renderCard(review));
  }
}

function renderCard(review) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="meta">
      <span class="badge ${review.status}">${review.status === "pending" ? "대기중" : "확정됨"}</span>
      <span class="date">${formatDate(review.created_at)}</span>
    </div>
    <div class="raw">${escapeHtml(review.raw_text)}</div>
    <div class="field-label">한국어</div>
    <div class="result-text">${escapeHtml(review.refined_ko)}</div>
    <div class="field-label">中文</div>
    <div class="result-text">${escapeHtml(review.refined_zh)}</div>
    <div class="btnrow">
      <button class="btn-copy" data-action="copy-ko">한국어 복사</button>
      <button class="btn-copy" data-action="copy-zh">中文 복사</button>
      ${review.status === "pending" ? '<button class="btn-confirm" data-action="confirm">확정</button>' : ""}
    </div>
  `;

  card.querySelector('[data-action="copy-ko"]').addEventListener("click", () => {
    navigator.clipboard.writeText(review.refined_ko || "");
  });
  card.querySelector('[data-action="copy-zh"]').addEventListener("click", () => {
    navigator.clipboard.writeText(review.refined_zh || "");
  });
  const confirmBtn = card.querySelector('[data-action="confirm"]');
  if (confirmBtn) {
    confirmBtn.addEventListener("click", async () => {
      confirmBtn.disabled = true;
      const { error } = await supabase
        .from("reviews")
        .update({ status: "confirmed", confirmed_at: new Date().toISOString() })
        .eq("id", review.id);
      if (error) {
        alert("확정 실패: " + error.message);
        confirmBtn.disabled = false;
        return;
      }
      loadReviews();
    });
  }
  return card;
}

loadReviews();
</script>
</body>
</html>
