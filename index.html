<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>리뷰인박스</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="리뷰인박스" />
<meta name="theme-color" content="#4c2c8f" />
<style>
  :root {
    --bg: #f5f3fb;
    --card-bg: #ffffff;
    --text: #1c1530;
    --muted: #6b6480;
    --accent: #4c2c8f;
    --accent-2: #7c5cff;
    --border: #e6e1f5;
    --pending: #ff9f43;
    --confirmed: #2ecc71;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14101f;
      --card-bg: #1f1930;
      --text: #f1eefb;
      --muted: #a79ecb;
      --accent: #a78bfa;
      --accent-2: #7c5cff;
      --border: #322a4a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 16px) 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  h1 { font-size: 20px; margin: 0; }
  .tabs { display: flex; gap: 8px; padding: 0 20px 12px; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }
  .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  main { padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
  }
  .card .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; color: white; }
  .badge.pending { background: var(--pending); }
  .badge.confirmed { background: var(--confirmed); }
  .date { font-size: 12px; color: var(--muted); }
  .raw { font-size: 13px; color: var(--muted); margin-bottom: 10px; white-space: pre-wrap; }
  label { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 4px; }
  textarea {
    width: 100%;
    min-height: 64px;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 10px;
    font-size: 14px;
    background: transparent;
    color: var(--text);
    resize: vertical;
    font-family: inherit;
  }
  .btnrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-copy { background: var(--border); color: var(--text); }
  .btn-confirm { background: var(--accent); color: white; }
  .btn-confirm:disabled { opacity: 0.5; }
  #login {
    max-width: 360px;
    margin: 80px auto;
    padding: 24px;
    text-align: center;
  }
  #login input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 14px;
    margin: 12px 0;
  }
  #login button { width: 100%; background: var(--accent); color: white; padding: 12px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }
  #notifyBar {
    margin: 0 20px 14px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--accent);
    color: white;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  #notifyBar button { background: white; color: var(--accent); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <h1>리뷰인박스</h1>
  <p class="hint">이메일로 로그인 링크를 보내드려요.</p>
  <input id="emailInput" type="email" placeholder="you@example.com" />
  <button id="sendLinkBtn">로그인 링크 받기</button>
  <p id="loginStatus" class="hint"></p>
</div>

<div id="appRoot" class="hidden">
  <header>
    <h1>리뷰인박스</h1>
    <button id="logoutBtn" class="btn-copy">로그아웃</button>
  </header>
  <div id="notifyBar" class="hidden">
    <span>새 리뷰 알림을 받으려면 알림을 켜주세요</span>
    <button id="enableNotifyBtn">알림 켜기</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-status="pending">대기중</div>
    <div class="tab" data-status="confirmed">확정됨</div>
  </div>
  <main id="list"></main>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://nuvwfcecaafgpksnvizd.supabase.co";
const SUPABASE_KEY = "sb_publishable_pnA8OfMO3-3mF7J-UNtbgQ_zv7SMKsE";
const VAPID_PUBLIC_KEY = "BIN-zo7WCD8WQ_qLnc8P279zzYxCXJPLTzdoRuHs4xbcC6oqky8VAebeJ7ljbXdTLk7jsnV0aVWmcOBEM6PesYQ";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const loginEl = document.getElementById("login");
const appRootEl = document.getElementById("appRoot");
const listEl = document.getElementById("list");
const loginStatusEl = document.getElementById("loginStatus");
const notifyBarEl = document.getElementById("notifyBar");

let currentTab = "pending";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return null;
  return await navigator.serviceWorker.register("sw.js");
}

async function checkNotifyState() {
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
    notifyBarEl.classList.add("hidden");
    return;
  }
  if (Notification.permission === "granted") {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    notifyBarEl.classList.toggle("hidden", !!sub);
  } else {
    notifyBarEl.classList.remove("hidden");
  }
}

async function enableNotifications() {
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return;
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
  });
  const json = sub.toJSON();
  await supabase.from("push_subscriptions").insert({
    endpoint: json.endpoint,
    p256dh: json.keys.p256dh,
    auth: json.keys.auth,
  });
  notifyBarEl.classList.add("hidden");
}

document.getElementById("enableNotifyBtn").addEventListener("click", () => {
  enableNotifications().catch((e) => alert("알림 설정 실패: " + e.message));
});

document.getElementById("sendLinkBtn").addEventListener("click", async () => {
  const email = document.getElementById("emailInput").value.trim();
  if (!email) return;
  loginStatusEl.textContent = "전송 중...";
  const { error } = await supabase.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin },
  });
  loginStatusEl.textContent = error ? "오류: " + error.message : "이메일을 확인해주세요. 링크를 눌러 로그인하세요.";
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabase.auth.signOut();
  showLogin();
});

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    currentTab = tab.dataset.status;
    loadReviews();
  });
});

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString("ko-KR", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

async function loadReviews() {
  listEl.innerHTML = "";
  const { data, error } = await supabase
    .from("reviews")
    .select("*")
    .eq("status", currentTab)
    .order("created_at", { ascending: false });

  if (error) {
    listEl.innerHTML = '<div class="empty">불러오기 실패: ' + escapeHtml(error.message) + "</div>";
    return;
  }
  if (!data || data.length === 0) {
    listEl.innerHTML = '<div class="empty">항목이 없습니다</div>';
    return;
  }
  for (const review of data) {
    listEl.appendChild(renderCard(review));
  }
}

function renderCard(review) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="meta">
      <span class="badge ${review.status}">${review.status === "pending" ? "대기중" : "확정됨"}</span>
      <span class="date">${formatDate(review.created_at)}</span>
    </div>
    <div class="raw">${escapeHtml(review.raw_text)}</div>
    <label>한국어</label>
    <textarea data-field="refined_ko">${escapeHtml(review.refined_ko)}</textarea>
    <label>中文</label>
    <textarea data-field="refined_zh">${escapeHtml(review.refined_zh)}</textarea>
    <div class="btnrow">
      <button class="btn-copy" data-action="copy-ko">한국어 복사</button>
      <button class="btn-copy" data-action="copy-zh">中文 복사</button>
      ${review.status === "pending" ? '<button class="btn-confirm" data-action="confirm">확정</button>' : ""}
    </div>
  `;

  const koArea = card.querySelector('[data-field="refined_ko"]');
  const zhArea = card.querySelector('[data-field="refined_zh"]');

  card.querySelector('[data-action="copy-ko"]').addEventListener("click", () => {
    navigator.clipboard.writeText(koArea.value);
  });
  card.querySelector('[data-action="copy-zh"]').addEventListener("click", () => {
    navigator.clipboard.writeText(zhArea.value);
  });
  const confirmBtn = card.querySelector('[data-action="confirm"]');
  if (confirmBtn) {
    confirmBtn.addEventListener("click", async () => {
      confirmBtn.disabled = true;
      const { error } = await supabase
        .from("reviews")
        .update({
          status: "confirmed",
          confirmed_at: new Date().toISOString(),
          refined_ko: koArea.value,
          refined_zh: zhArea.value,
        })
        .eq("id", review.id);
      if (error) {
        alert("확정 실패: " + error.message);
        confirmBtn.disabled = false;
        return;
      }
      loadReviews();
    });
  }
  return card;
}

function showLogin() {
  loginEl.classList.remove("hidden");
  appRootEl.classList.add("hidden");
}

function showApp() {
  loginEl.classList.add("hidden");
  appRootEl.classList.remove("hidden");
  loadReviews();
  checkNotifyState();
}

async function init() {
  await registerServiceWorker();
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    showApp();
  } else {
    showLogin();
  }
  supabase.auth.onAuthStateChange((_event, session) => {
    if (session) showApp();
    else showLogin();
  });
}

init();
</script>
</body>
</html>
